name: ai-research-assistant

services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Development defaults; configure unique credentials for production.
      POSTGRES_DB: ${POSTGRES_DB:-research}
      POSTGRES_USER: ${POSTGRES_USER:-research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [research_net]

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-research}:${POSTGRES_PASSWORD:-research}@postgres:5432/${POSTGRES_DB:-research}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-administrator-password}
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Stored beside uploads so container rebuilds/restarts preserve generated keys.
      LOCAL_SECRETS_FILE: ${LOCAL_SECRETS_FILE:-/data/uploads/.local-secrets.json}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    networks: [research_net]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "8080:80"
    networks: [research_net]

  adminer:
    image: adminer:5
    depends_on: [postgres]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    networks: [research_net]

volumes:
  postgres_data:
  uploads:

networks:
  research_net:
    driver: bridge
